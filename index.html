    --cream:#FFF9F0;
    --card:#FFFFFF;
    --ink:#2D2A3A;
    --ink-soft:#6B6577;
    --coral:#FF6B4A;
    --coral-soft:#FFE3DA;
    --teal:#2EC4B6;
    --teal-soft:#DFF6F3;
    --gold:#FFC145;
    --gold-soft:#FFF1D6;
    --line:#F0E9DC;
    --danger:#E15554;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:#EFE7D8; font-family:'Noto Sans Thai', -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; color:var(--ink);}
  .long-text{ font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  textarea{ font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  body{
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:28px 10px;
  }
  .phone{
    width:100%;
    max-width:412px;
    min-height:850px;
    background:var(--cream);
    border-radius:44px;
    border:10px solid #17151C;
    box-shadow:0 30px 60px -20px rgba(45,42,58,0.45);
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  @media (max-width:460px){
    body{padding:0;}
    .phone{border-radius:0; border:none; min-height:100vh; max-width:100%; box-shadow:none;}
  }
  .notch{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:120px; height:26px; background:#17151C; border-radius:0 0 18px 18px; z-index:50;
  }
  .statusbar{
    height:46px; flex:0 0 auto; display:flex; align-items:flex-end; justify-content:space-between;
    padding:0 26px 6px; font-size:13px; font-weight:600; color:var(--ink);
  }
  .screen{ flex:1; overflow-y:auto; padding-bottom:86px; position:relative; }
  .screen::-webkit-scrollbar{display:none;}

  /* ---- Top bar ---- */
  .topbar{ padding:6px 20px 14px; display:flex; align-items:center; justify-content:space-between; }
  .topbar h1{ font-size:22px; margin:0; letter-spacing:-0.3px; font-weight:800; }
  .topbar .sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .code-pill{
    background:var(--card); border:1px solid var(--line); border-radius:20px;
    padding:6px 12px; font-size:12px; font-weight:700; color:var(--ink-soft); display:flex; align-items:center; gap:6px; cursor:pointer;
  }

  .navbar{
    position:absolute; bottom:0; left:0; right:0; height:78px;
    background:rgba(255,249,240,0.92); backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-around;
    padding-bottom:14px; z-index:40;
  }
  .navbtn{ display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; color:var(--ink-soft); font-size:10.5px; font-weight:600; cursor:pointer; padding:4px 8px; }
  .navbtn.active{ color:var(--coral); }
  .navbtn svg{ width:23px; height:23px; }

  /* ---- Generic ---- */
  .px{ padding-left:20px; padding-right:20px; }
  .card{ background:var(--card); border-radius:22px; padding:18px; border:1px solid var(--line); }
  .btn{
    border:none; border-radius:15px; padding:13px 16px; font-size:14.5px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%;

  .btn-coral{ background:var(--coral); color:white; }
  .btn-teal{ background:var(--teal); color:white; }
  .btn-ghost{ background:var(--card); color:var(--ink); border:1.5px solid var(--line); }
  .btn-sm{ padding:8px 13px; font-size:12.5px; border-radius:11px; width:auto; }
  .icon-btn{
    width:33px; height:33px; border-radius:11px; background:var(--card); border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; flex:0 0 auto; cursor:pointer; color:var(--ink-soft);

  button, input, select{ font-family:inherit; }
  .close-x svg{ width:14px; height:14px; }

    display:flex; align-items:flex-end;

  .modal-sheet{

  .close-x{ position:absolute; top:16px; right:16px; background:var(--card); border:1px solid var(--line); width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .avatar{
    width:30px; height:30px; border-radius:50%; background:var(--coral-soft); color:var(--coral);
    display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:800; flex:0 0 auto;

  .avatar.teal{ background:var(--teal-soft); color:#158A80; }
  .avatar.gold{ background:var(--gold-soft); color:#8A6200; }
  .toast{
    position:absolute; top:56px; left:50%; transform:translateX(-50%); background:var(--ink); color:white;
    padding:10px 18px; border-radius:30px; font-size:13px; font-weight:600; z-index:80; opacity:0; transition:opacity .25s;

  .toast.show{ opacity:1; }
  .checkbox{
    width:22px; height:22px; border-radius:7px; border:2px solid var(--line); flex:0 0 auto; cursor:pointer;
    display:flex; align-items:center; justify-content:center;

  .checkbox.checked{ background:var(--teal); border-color:var(--teal); }

    flex:0 0 auto; padding:8px 15px; border-radius:14px; background:var(--card); border:1.5px solid var(--line);

  .tl-time{ width:46px; flex:0 0 auto; text-align:right; font-size:11.5px; font-weight:700; color:var(--ink-soft); padding-top:15px; }
  .tl-track{ flex:0 0 auto; width:14px; display:flex; flex-direction:column; align-items:center; }
  .tl-dot{ width:11px; height:11px; border-radius:50%; background:var(--coral); margin-top:17px; flex:0 0 auto; box-shadow:0 0 0 3px var(--coral-soft); }
  .tl-line{ flex:1; width:2px; background:var(--line); margin-top:3px; min-height:18px; }
  .tl-card{ flex:1; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:13px 15px; margin-bottom:16px; }

  .wx-temp{ font-size:56px; font-weight:200; line-height:1.1; margin-top:2px; }
  .wx-cond{ font-size:14.5px; font-weight:600; opacity:0.95; margin-top:-2px; }
  .wx-hilo{ font-size:13px; font-weight:600; opacity:0.85; margin-top:8px; }

function copyText(text, btn){
  const done = ()=>{ const o=btn.textContent; btn.textContent='คัดลอกแล้ว ✓'; setTimeout(()=>btn.textContent=o,1500); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  }else fallbackCopy(text,done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ showToast('คัดลอกไม่สำเร็จ ลองกดเลือกข้อความเอง'); }
  document.body.removeChild(ta);
}

function showToast(msg){
  let t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  $('#phone').appendChild(t);

function emptyTrip(name){
  return {
    name: name || 'ทริปใหม่ของเรา',
    startDate:'', endDate:'',
    members: [],
    destinations: [], // {id, day, time, name, note}
    expenses: [], // {id, desc, amount, paidBy, split[], category, source, date}
    fund: { target:0, contributions:[] }, // contributions {id,name,amount}
    packing: [], // {id, item, checked}
    docs: [], // {id, title, url, note}
    weatherCache: {},
    fxCache: {} // key "BASE_TARGET" -> {rate, fetchedAt}
  };
}

/* ============ storage (Firebase Realtime Database) ============ */
function lsGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function lsSet(key,val){ try{ localStorage.setItem(key,val); }catch(e){} }

async function loadMe(){
  try{
    const v = lsGet('trip-planner-me');
    if(v) ME = JSON.parse(v);
  }catch(e){}
}
async function saveMe(){
  lsSet('trip-planner-me', JSON.stringify(ME));
}
async function loadTrip(code){
  try{
    const snap = await db.ref('trips/'+code).once('value');
    const val = snap.val();
    if(val){
      TRIP = val;
      if(!TRIP.fxCache) TRIP.fxCache = {};
      if(!TRIP.destinations) TRIP.destinations = [];
      CODE = code; ME.lastCode = code; saveMe();
      if(code.toUpperCase()==='FRCA5F' && TRIP.destinations.length===0){
        PRESET_TRIP.destinations.forEach(d=> TRIP.destinations.push({ id:uid(), ...d }));
        if(!TRIP.startDate){ TRIP.startDate = PRESET_TRIP.startDate; TRIP.endDate = PRESET_TRIP.endDate; }
        await saveTrip();
      }
      return true;
    }
  }catch(e){ console.error(e); }
  return false;
}
async function saveTrip(){
  if(!CODE || !TRIP) return;
  try{ await db.ref('trips/'+CODE).set(TRIP); }catch(e){ showToast('บันทึกไม่สำเร็จ เช็คอินเทอร์เน็ต'); }
}
function attachLiveSync(){
  if(!CODE || LIVE_SYNC_ATTACHED) return;
  LIVE_SYNC_ATTACHED = true;
  db.ref('trips/'+CODE).on('value', snap=>{
    const fresh = snap.val();
    if(!fresh) return;
    TRIP = fresh;
    if(!TRIP.fxCache) TRIP.fxCache = {};
    if(!TRIP.destinations) TRIP.destinations = [];
    if(document.querySelector('.modal-backdrop')) return; // don't interrupt someone mid-edit
    const activeTag = document.activeElement && document.activeElement.tagName;
    if(['INPUT','TEXTAREA','SELECT'].includes(activeTag)) return;
    render();
  });
}
async function manualRefresh(){
  if(!CODE) return;
  try{
    const snap = await db.ref('trips/'+CODE).once('value');
    const val = snap.val();
    if(val){ TRIP = val; if(!TRIP.fxCache) TRIP.fxCache={}; render(); showToast('อัปเดตข้อมูลล่าสุดแล้ว ✓'); }
  }catch(e){ showToast('รีเฟรชไม่สำเร็จ เช็คอินเทอร์เน็ต'); }
}

/* ============ render root ============ */
async function boot(){
  await loadMe();
  if(ME.lastCode){
    const ok = await loadTrip(ME.lastCode);
    if(ok){ render(); startClock(); attachLiveSync(); return; }
  }
  renderWelcome();
  startClock();
}
function startClock(){
  const set = ()=>{ const d=new Date(); $('#clock').textContent = d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',hour12:false}); };
  set(); setInterval(set,30000);
}

/* ============ MAIN RENDER ============ */
function render(){
  if(!TRIP) return renderWelcome();
  const html = `
    <div class="topbar">
      <div>
        <h1>${TRIP.name}</h1>
        <div class="sub">${TRIP.members.length} คน · ${fmtDate(TRIP.startDate)||'ยังไม่กำหนดวัน'}</div>
      </div>
      <button class="icon-btn" id="btn-refresh">${ICONS.refresh}</button>
    </div>
    <div id="tabcontent"></div>
    <div class="navbar">
      ${navBtn('home','หน้าแรก')}
      ${navBtn('plan','แพลน')}
      ${navBtn('money','เงิน')}
      ${navBtn('weather','อากาศ')}
      ${navBtn('more','อื่นๆ')}
    </div>
  `;
  $('#screen').innerHTML = html;
  const btnRefresh = $('#btn-refresh');
  if(btnRefresh) btnRefresh.onclick = ()=> manualRefresh();
  document.querySelectorAll('.navbtn').forEach(b=> b.onclick = ()=>{ TAB=b.dataset.tab; render(); });
  const c = $('#tabcontent');
  if(TAB==='home') c.innerHTML = viewHome();
  if(TAB==='plan') c.innerHTML = viewPlan();
  if(TAB==='money') c.innerHTML = viewMoney();
  if(TAB==='weather') c.innerHTML = viewWeather();
  if(TAB==='more') c.innerHTML = viewMore();
  attachTabEvents();
  if(TAB==='weather') autoFetchWeatherIfNeeded();
}
function navBtn(tab,label){
  return `<button class="navbtn ${TAB===tab?'active':''}" data-tab="${tab}">${ICONS[tab]}<span>${label}</span></button>`;
}

/* ============ PLAN ============ */
function viewPlan(){
  const days = groupBy(TRIP.destinations, d=>d.day||'ยังไม่กำหนดวัน');
  const dayKeys = Object.keys(days).sort((a,b)=> a==='ยังไม่กำหนดวัน'?1:b==='ยังไม่กำหนดวัน'?-1:a.localeCompare(b,'th'));
  if(!PLAN_DAY || !dayKeys.includes(PLAN_DAY)) PLAN_DAY = dayKeys[0];
  const items = PLAN_DAY ? [...days[PLAN_DAY]].sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99')) : [];

  return `
    <div class="px" style="padding-top:4px;padding-bottom:4px;">
      <button class="btn btn-coral" id="btn-addplace">${ICONS.plus} เพิ่มสถานที่</button>

      <div class="empty">${ICONS.pin}<div style="font-weight:700;">ยังไม่มีสถานที่ในแผน</div><div style="font-size:13px;">เริ่มปักหมุดที่แรกกันเลย</div></div>
    ` : `
      <div class="day-tabs">
        ${dayKeys.map(day=>`<button class="day-tab ${day===PLAN_DAY?'active':''}" data-day="${day}">${day}</button>`).join('')}
      </div>
      <div class="timeline">
        ${items.map((d,i)=>`
          <div class="tl-item">
            <div class="tl-time">${d.time||'—'}</div>
            <div class="tl-track">
              <div class="tl-dot"></div>
              ${i<items.length-1? `<div class="tl-line"></div>` : ''}
            </div>
            <div class="tl-card edit-place" data-id="${d.id}" style="cursor:pointer;">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
                <div style="font-weight:800;font-size:15px;">${d.name}</div>
                <button class="icon-btn del-place" data-id="${d.id}">${ICONS.close}</button>
              </div>
              ${d.note? `<div class="long-text" style="color:var(--ink-soft);font-size:13px;margin-top:3px;">${d.note}</div>`:''}
              ${d.showMap!==false ? `
              <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.name)}" target="_blank" onclick="event.stopPropagation()" style="text-decoration:none;">
                <div style="margin-top:9px;font-size:12.5px;font-weight:700;color:var(--teal);display:flex;align-items:center;gap:5px;">${ICONS.pin} เปิดใน Google Maps</div>
              </a>
              ` : ''}
            </div>
          </div>
        `).join('')}
      </div>
    `}
  `;
}

/* ============ MONEY ============ */
function viewMoney(){
  const fundIn = TRIP.fund.contributions.reduce((s,c)=>s+Number(c.amount||0),0);
  const fundOut = TRIP.expenses.filter(e=>e.source==='fund').reduce((s,e)=>s+Number(e.amount||0),0);
  const fundBalance = fundIn - fundOut;

  const personalExpenses = TRIP.expenses.filter(e=>e.source==='personal');
  const balances = {};
  TRIP.members.forEach(m=> balances[m.name]=0);
  personalExpenses.forEach(e=>{
    const split = e.split.length? e.split : TRIP.members.map(m=>m.name);

function simplifyDebts(balances){
  const eps=0.5;
  let creditors = Object.entries(balances).filter(([,v])=>v>eps).map(([name,v])=>({name,v})).sort((a,b)=>b.v-a.v);
  let debtors = Object.entries(balances).filter(([,v])=>v<-eps).map(([name,v])=>({name,v:-v})).sort((a,b)=>b.v-a.v);
  const out=[];
  let i=0,j=0;
  while(i<debtors.length && j<creditors.length){
    const amt = Math.min(debtors[i].v, creditors[j].v);
    out.push({from:debtors[i].name, to:creditors[j].name, amount:Math.round(amt)});
    debtors[i].v -= amt; creditors[j].v -= amt;
    if(debtors[i].v<=eps) i++;
    if(creditors[j].v<=eps) j++;
  }
  return out;
}
function groupBy(arr,fn){ return arr.reduce((acc,x)=>{ const k=fn(x); (acc[k]=acc[k]||[]).push(x); return acc; },{}); }

async function fetchWeatherCore(place){
  const geoResp = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(place)}&count=1&language=en&format=json`);
  const geoData = await geoResp.json();
  if(!geoData.results || !geoData.results.length) throw new Error('place not found');
  const { latitude, longitude } = geoData.results[0];

  let url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto`;
  if(TRIP.startDate){
    url += `&start_date=${TRIP.startDate}&end_date=${TRIP.endDate||TRIP.startDate}`;
  }
  const resp = await fetch(url);
  const data = await resp.json();
  if(!data.daily || !data.daily.time || !data.daily.time.length) throw new Error('no forecast (อาจไกลเกินช่วงพยากรณ์ 16 วัน)');
  const idx = 0; // first day in range (or today if no date set)
  const code = data.daily.weathercode[idx];
  const meta = WMO_MAP[code] || {icon:'cloudy', label:'ไม่ทราบสภาพอากาศ'};
  const high = Math.round(data.daily.temperature_2m_max[idx]);
  const low = Math.round(data.daily.temperature_2m_min[idx]);
  const rain = Math.round(data.daily.precipitation_probability_max[idx] ?? 0);
  const advice = rain>50 ? 'ฝนตกโอกาสสูง พกร่มหรือเสื้อกันฝนไปด้วยนะ' : high>=32 ? 'อากาศร้อน พกน้ำและครีมกันแดดไปด้วย' : low<=15 ? 'อากาศเย็น เตรียมเสื้อกันหนาวไปด้วย' : 'อากาศดี เตรียมตัวออกไปเที่ยวได้เลย';
  TRIP.weatherCache[place] = { condition: meta.label, icon: meta.icon, high, low, rain_chance: rain, advice, fetchedAt: Date.now() };
  await saveTrip();
}
async function fetchWeather(place, btn){
  const original = btn.textContent;
  btn.textContent = 'กำลังเช็ค...'; btn.disabled = true;
  WX_TRIED.delete(place);
  try{
    await fetchWeatherCore(place);
    WX_PLACE = place;

  }catch(e){
    showToast(e.message && e.message.includes('16') ? 'พยากรณ์ล่วงหน้าได้ไม่เกิน 16 วัน ลองใหม่ใกล้วันเดินทาง' : 'ดึงข้อมูลอากาศไม่สำเร็จ ลองใหม่อีกครั้ง');
    btn.textContent = original; btn.disabled = false;
  }
}
function autoFetchWeatherIfNeeded(){
  const places = [...new Set(TRIP.destinations.map(d=>d.name))].sort((a,b)=>a.localeCompare(b,'th'));

  document.querySelectorAll('.day-tab').forEach(b=> b.onclick = ()=>{ PLAN_DAY = b.dataset.day; render(); });
  document.querySelectorAll('.edit-place').forEach(el=> el.onclick = ()=>{
    const d = TRIP.destinations.find(x=>x.id===el.dataset.id);
    if(d) openPlaceModal(d);
  });
  document.querySelectorAll('.del-place').forEach(b=> b.onclick = async (e)=>{
    e.stopPropagation();
    TRIP.destinations = TRIP.destinations.filter(d=>d.id!==b.dataset.id);
    await saveTrip(); render();
  });

  // MONEY
  const btnAddExpense = $('#btn-addexpense');
  if(btnAddExpense) btnAddExpense.onclick = ()=> openExpenseModal();
  const btnFundIn = $('#btn-fundin');
  if(btnFundIn) btnFundIn.onclick = ()=> openFundInModal();
  const btnFundTarget = $('#btn-fundtarget');
  if(btnFundTarget) btnFundTarget.onclick = ()=> openFundTargetModal();
  document.querySelectorAll('.del-expense').forEach(b=> b.onclick = async ()=>{
    TRIP.expenses = TRIP.expenses.filter(e=>e.id!==b.dataset.id);
    await saveTrip(); render();
  });
  const btnFxRate = $('#btn-fxrate');
  if(btnFxRate) btnFxRate.onclick = ()=> openFxModal();

  // WEATHER
  document.querySelectorAll('.wx-refresh').forEach(b=> b.onclick = ()=> fetchWeather(b.dataset.place, b));
  const wxSelect = $('#wx-select');
  if(wxSelect) wxSelect.onchange = ()=>{ WX_PLACE = wxSelect.value; render(); };

  // MORE
  const btnShare = $('#btn-share');
  if(btnShare) btnShare.onclick = openShareModal;
  const btnAddPack = $('#btn-addpack');
  if(btnAddPack) btnAddPack.onclick = ()=> openPackModal();
  const btnAddDoc = $('#btn-adddoc');
  if(btnAddDoc) btnAddDoc.onclick = ()=> openDocModal();
  document.querySelectorAll('.pack-toggle').forEach(b=> b.onclick = async ()=>{
    const item = TRIP.packing.find(p=>p.id===b.dataset.id);
    item.checked = !item.checked;
    await saveTrip(); render();
  });
  document.querySelectorAll('.del-pack').forEach(b=> b.onclick = async (e)=>{
    e.stopPropagation();
    TRIP.packing = TRIP.packing.filter(p=>p.id!==b.dataset.id);
    await saveTrip(); render();
  });
  document.querySelectorAll('.del-doc').forEach(b=> b.onclick = async (e)=>{
    e.preventDefault(); e.stopPropagation();
    TRIP.docs = TRIP.docs.filter(d=>d.id!==b.dataset.id);
    await saveTrip(); render();
  });
}

/* ============ modals: content ============ */
function openPlaceModal(existing){
  openModal(existing? 'แก้ไขสถานที่' : 'เพิ่มสถานที่', `
    <label class="field-label" style="margin-top:6px;">ชื่อสถานที่</label>
    <input id="m-name" placeholder="เช่น วัดพระธาตุดอยสุเทพ" value="${existing? existing.name.replace(/"/g,'&quot;') : ''}">
    <div class="row">
      <div style="flex:1;"><label class="field-label">วัน</label><input id="m-day" placeholder="เช่น Day 1 หรือ 12 ธ.ค." value="${existing? (existing.day||'').replace(/"/g,'&quot;') : ''}"></div>
      <div style="flex:1;"><label class="field-label">เวลา</label><input id="m-time" type="time" value="${existing? (existing.time||'') : ''}"></div>
    </div>
    <label class="field-label">โน้ต (ถ้ามี)</label>
    <textarea id="m-note" rows="2" placeholder="เช่น เข้าฟรีก่อน 9 โมง">${existing? (existing.note||'') : ''}</textarea>
    <label style="display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13.5px;font-weight:600;color:var(--ink-soft);">
      <input type="checkbox" id="m-showmap" ${(!existing || existing.showMap!==false)?'checked':''} style="width:18px;height:18px;"> แสดงลิงก์ Google Maps สำหรับที่นี่
    </label>
    <button class="btn btn-coral" style="margin-top:18px;" id="m-save">${existing? 'บันทึกการแก้ไข':'บันทึกสถานที่'}</button>
  `, wrap=>{
    wrap.querySelector('#m-save').onclick = async ()=>{
      const name = wrap.querySelector('#m-name').value.trim();
      if(!name) return showToast('ใส่ชื่อสถานที่ก่อนนะ');
      const payload = { name, day: wrap.querySelector('#m-day').value.trim()||'ยังไม่กำหนดวัน', time: wrap.querySelector('#m-time').value, note: wrap.querySelector('#m-note').value.trim(), showMap: wrap.querySelector('#m-showmap').checked };
      if(existing){
        Object.assign(existing, payload);
      }else{
        TRIP.destinations.push({ id:uid(), ...payload });
      }
      await saveTrip(); wrap.remove(); render();
    };
  });
}

function openExpenseModal(){
  const memberOpts = TRIP.members.map(m=>`<option value="${m.name}">${m.name}</option>`).join('');
  const checks = TRIP.members.map(m=>`
    <label style="display:flex;align-items:center;gap:8px;padding:7px 0;font-size:14px;">
      <input type="checkbox" class="m-split" value="${m.name}" checked style="width:18px;height:18px;">${m.name}
    </label>`).join('');
  openModal('เพิ่มค่าใช้จ่าย', `
    <label class="field-label" style="margin-top:6px;">รายการ</label>
    <input id="m-desc" placeholder="เช่น ค่าอาหารเย็น">
    <div class="row">
      <div style="flex:1;"><label class="field-label">จำนวนเงิน (฿)</label><input id="m-amount" type="number" placeholder="0"></div>
      <div style="flex:1;"><label class="field-label">หมวด</label><input id="m-cat" placeholder="อาหาร/ที่พัก..."></div>
    </div>
    <label class="field-label">ใครจ่าย</label>
    <select id="m-paidby">${memberOpts}</select>
    <label class="field-label">แหล่งเงิน</label>
    <div class="row">
      <label style="flex:1;display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:10px;font-size:13.5px;"><input type="radio" name="src" value="personal" checked> จ่ายเอง หารทีหลัง</label>
      <label style="flex:1;display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:10px;font-size:13.5px;"><input type="radio" name="src" value="fund"> จากกองกลาง</label>
    </div>
    <div id="split-block">
      <label class="field-label">หารกับใคร</label>
      ${checks}
    </div>
    <button class="btn btn-coral" style="margin-top:14px;" id="m-save">บันทึกรายการ</button>
  `, wrap=>{
    wrap.querySelectorAll('input[name=src]').forEach(r=> r.onchange = ()=>{
      wrap.querySelector('#split-block').style.display = r.value==='fund' && r.checked ? 'none':'block';
    });
    wrap.querySelector('#m-save').onclick = async ()=>{
      const desc = wrap.querySelector('#m-desc').value.trim();
      const amount = Number(wrap.querySelector('#m-amount').value);
      if(!desc || !amount) return showToast('กรอกรายการและจำนวนเงินก่อนนะ');
      const source = wrap.querySelector('input[name=src]:checked').value;
      const split = Array.from(wrap.querySelectorAll('.m-split:checked')).map(c=>c.value);
      TRIP.expenses.push({
        id:uid(), desc, amount, category: wrap.querySelector('#m-cat').value.trim(),
        paidBy: wrap.querySelector('#m-paidby').value, source, split, date: Date.now()
      });
      await saveTrip(); wrap.remove(); render();
    };
  });
}

function openFundInModal(){
  const memberOpts = TRIP.members.map(m=>`<option value="${m.name}">${m.name}</option>`).join('');
  openModal('เติมเงินกองกลาง', `
    <label class="field-label" style="margin-top:6px;">ใคร</label>
    <select id="m-name2">${memberOpts}</select>
    <label class="field-label">จำนวนเงิน (฿)</label>
    <input id="m-amt2" type="number" placeholder="0">
    <button class="btn btn-teal" style="margin-top:16px;" id="m-save2">บันทึก</button>
  `, wrap=>{
    wrap.querySelector('#m-save2').onclick = async ()=>{
      const amount = Number(wrap.querySelector('#m-amt2').value);
      if(!amount) return showToast('ใส่จำนวนเงินก่อนนะ');
      TRIP.fund.contributions.push({ id:uid(), name: wrap.querySelector('#m-name2').value, amount });
      await saveTrip(); wrap.remove(); render();
    };
  });
}
function openFundTargetModal(){
  openModal('ตั้งเป้าหมายกองกลาง', `
    <label class="field-label" style="margin-top:6px;">ยอดเป้าหมายรวม (฿)</label>
    <input id="m-target" type="number" value="${TRIP.fund.target||''}" placeholder="เช่น 5000">
    <div style="color:var(--ink-soft);font-size:12.5px;margin-top:8px;">เฉลี่ยคนละ ฿${TRIP.members.length? thb((Number($('#m-target')?.value||TRIP.fund.target||0))/TRIP.members.length):0}</div>
    <button class="btn btn-teal" style="margin-top:16px;" id="m-savetarget">บันทึก</button>
  `, wrap=>{
    wrap.querySelector('#m-savetarget').onclick = async ()=>{
      TRIP.fund.target = Number(wrap.querySelector('#m-target').value)||0;
      await saveTrip(); wrap.remove(); render();
    };
  });
}

function openPackModal(){
  openModal('เพิ่มของที่ต้องแพ็ค', `
    <label class="field-label" style="margin-top:6px;">ชื่อของ</label>
    <input id="m-item" placeholder="เช่น ร่ม, ยากันยุง, ปลั๊กพ่วง">
    <button class="btn btn-coral" style="margin-top:16px;" id="m-savepack">เพิ่มลงลิสต์</button>
    <div style="margin-top:16px;">
      <div class="field-label" style="margin-top:0;">แนะนำ (กดเพื่อเพิ่มเลย)</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">
        ${['ร่ม/เสื้อกันฝน','ยากันยุง','ที่ชาร์จ/พาวเวอร์แบงก์','ยาประจำตัว','ครีมกันแดด','ผ้าเย็น','บัตรประชาชน/พาสปอร์ต'].map(s=>`<button class="chip suggest-pack" style="cursor:pointer;border:none;">${s}</button>`).join('')}
      </div>
    </div>
  `, wrap=>{
    const add = async (item)=>{
      if(!item) return;
      TRIP.packing.push({ id:uid(), item, checked:false });
      await saveTrip();
    };
    wrap.querySelector('#m-savepack').onclick = async ()=>{
      const item = wrap.querySelector('#m-item').value.trim();
      if(!item) return showToast('ใส่ชื่อของก่อนนะ');
      await add(item); wrap.remove(); render();
    };
    wrap.querySelectorAll('.suggest-pack').forEach(b=> b.onclick = async ()=>{
      await add(b.textContent); wrap.remove(); render();
    });
  });
}

function openDocModal(){
  openModal('เพิ่มเอกสาร', `
    <label class="field-label" style="margin-top:6px;">ชื่อเอกสาร</label>
    <input id="m-title" placeholder="เช่น ตั๋วเครื่องบินขาไป">
    <label class="field-label">ลิงก์ (ถ้ามี)</label>
    <input id="m-url" placeholder="https://...">
    <label class="field-label">โน้ต</label>
    <input id="m-note2" placeholder="เช่น เลขที่จอง, รหัสผ่าน (ไม่แนะนำใส่ข้อมูลอ่อนไหว)">
    <button class="btn btn-coral" style="margin-top:16px;" id="m-savedoc">บันทึก</button>
  `, wrap=>{
    wrap.querySelector('#m-savedoc').onclick = async ()=>{
      const title = wrap.querySelector('#m-title').value.trim();
      if(!title) return showToast('ใส่ชื่อเอกสารก่อนนะ');
      TRIP.docs.push({ id:uid(), title, url: wrap.querySelector('#m-url').value.trim(), note: wrap.querySelector('#m-note2').value.trim() });
      await saveTrip(); wrap.remove(); render();
    };
  });
}

boot();
</script>
